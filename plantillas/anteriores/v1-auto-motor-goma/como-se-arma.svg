<?xml version="1.0" encoding="UTF-8"?>
<!-- Dibujo explicativo (NO es para cortar). Vista de costado a escala 2:1 + circuito. -->
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="Arial, sans-serif">
  <rect width="820" height="440" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">Auto con motor y goma: vista de costado</text>

  <!-- piso -->
  <line x1="20" y1="230" x2="440" y2="230" stroke="#888" stroke-width="2"/>

  <!-- soportes de eje -->
  <rect x="90" y="136" width="60" height="52" fill="#e2c9a0" stroke="#8a6a3a"/>
  <rect x="290" y="136" width="60" height="52" fill="#e2c9a0" stroke="#8a6a3a"/>

  <!-- ruedas -->
  <circle cx="120" cy="176" r="54" fill="#d9b98a" stroke="#8a6a3a" stroke-width="2"/>
  <circle cx="120" cy="176" r="54" fill="none" stroke="#333" stroke-width="5" opacity="0.8"/>
  <circle cx="120" cy="176" r="3" fill="#333"/>
  <circle cx="320" cy="176" r="54" fill="#d9b98a" stroke="#8a6a3a" stroke-width="2" opacity="0.55"/>
  <circle cx="320" cy="176" r="54" fill="none" stroke="#333" stroke-width="5" opacity="0.5"/>

  <!-- polea en el eje trasero -->
  <circle cx="320" cy="176" r="36" fill="#c49a5e" stroke="#6b4c22" stroke-width="2"/>
  <circle cx="320" cy="176" r="28" fill="none" stroke="#6b4c22" stroke-dasharray="4 3"/>
  <circle cx="320" cy="176" r="3" fill="#333"/>

  <!-- chasis -->
  <rect x="60" y="130" width="320" height="6" fill="#c8a46e" stroke="#6b4c22"/>

  <!-- portapilas -->
  <rect x="156" y="100" width="116" height="30" rx="3" fill="#333"/>
  <rect x="162" y="106" width="50" height="18" rx="9" fill="#e9a23b"/>
  <rect x="216" y="106" width="50" height="18" rx="9" fill="#e9a23b"/>
  <text x="185" y="96" font-size="12" fill="#222">2 pilas AA</text>

  <!-- boton -->
  <rect x="76" y="114" width="16" height="16" fill="#555"/>
  <rect x="78" y="104" width="12" height="10" rx="3" fill="#d33"/>
  <text x="58" y="96" font-size="12" fill="#222">botón</text>

  <!-- soporte del motor y motor -->
  <rect x="300" y="74" width="80" height="56" fill="#e2c9a0" stroke="#8a6a3a" opacity="0.6"/>
  <rect x="300" y="91" width="40" height="30" rx="6" fill="#9aa3ad" stroke="#555"/>
  <circle cx="320" cy="106" r="3" fill="#333"/>
  <text x="345" y="68" font-size="12" fill="#222">motor</text>

  <!-- goma (transmision) -->
  <line x1="317" y1="106" x2="292" y2="176" stroke="#e8590c" stroke-width="3"/>
  <line x1="323" y1="106" x2="348" y2="176" stroke="#e8590c" stroke-width="3"/>
  <text x="385" y="160" font-size="12" fill="#e8590c">goma</text>
  <text x="385" y="175" font-size="12" fill="#6b4c22">polea</text>

  <!-- cables -->
  <path d="M160,112 C130,112 110,112 92,118" fill="none" stroke="#d33" stroke-width="2"/>
  <path d="M84,104 C90,70 250,60 300,98" fill="none" stroke="#d33" stroke-width="2"/>
  <path d="M272,118 C285,118 292,112 300,112" fill="none" stroke="#111" stroke-width="2"/>

  <text x="20" y="262" font-size="13" fill="#444">El motor gira rápido. La goma pasa por el eje fino</text>
  <text x="20" y="280" font-size="13" fill="#444">del motor y por la polea grande: así baja la velocidad</text>
  <text x="20" y="298" font-size="13" fill="#444">y gana fuerza para mover las ruedas traseras.</text>

  <!-- CIRCUITO -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#222">El circuito (sin soldar)</text>
  <rect x="490" y="70" width="110" height="50" rx="6" fill="#333"/>
  <text x="508" y="100" font-size="14" fill="#fff">PILAS 3V</text>
  <rect x="660" y="70" width="110" height="50" rx="6" fill="#d33"/>
  <text x="690" y="100" font-size="14" fill="#fff">BOTÓN</text>
  <rect x="575" y="190" width="110" height="50" rx="25" fill="#9aa3ad"/>
  <text x="603" y="220" font-size="14" fill="#111">MOTOR</text>
  <path d="M600,95 H660" stroke="#d33" stroke-width="3" fill="none"/>
  <text x="615" y="88" font-size="12" fill="#d33">+ rojo</text>
  <path d="M715,120 V215 H685" stroke="#d33" stroke-width="3" fill="none"/>
  <path d="M575,215 H545 V120" stroke="#111" stroke-width="3" fill="none"/>
  <text x="500" y="170" font-size="12" fill="#111">− negro</text>
  <circle cx="715" cy="160" r="5" fill="#fff" stroke="#2b8a3e" stroke-width="2"/>
  <circle cx="545" cy="160" r="5" fill="#fff" stroke="#2b8a3e" stroke-width="2"/>
  <text x="725" y="164" font-size="11" fill="#2b8a3e">borne</text>
  <text x="480" y="275" font-size="13" fill="#444">Todo en una sola vuelta: pila → botón → motor → pila.</text>
  <text x="480" y="293" font-size="13" fill="#444">Las uniones van con bornes a presión (tipo Wago).</text>
  <text x="480" y="311" font-size="13" fill="#444">Si el auto va para atrás: dar vuelta los cables del motor.</text>

  <!-- piezas -->
  <text x="20" y="345" font-size="16" font-weight="bold" fill="#222">Qué lleva cada kit</text>
  <text x="20" y="367" font-size="13" fill="#444">• 13 piezas de MDF 3 mm (1 hoja de 30 x 20 cm)  • 2 palitos de brochette de 3 mm (ejes)</text>
  <text x="20" y="385" font-size="13" fill="#444">• Motor DC 3V tipo 130  • Portapilas 2xAA con cables  • Pulsador con traba de 12 mm</text>
  <text x="20" y="403" font-size="13" fill="#444">• 2 bornes a presión  • 1 gomita de billete (transmisión)  • 4 gomitas o globo (cubiertas)</text>
  <text x="20" y="421" font-size="13" fill="#444">• 4 pedacitos de sorbete (separan las ruedas)  • Cola vinílica</text>
</svg>
