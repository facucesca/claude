<?xml version="1.0" encoding="UTF-8"?>
<!--
  Auto con motor y transmision por goma - MDF 3 mm
  Hoja: 300 x 200 mm. Unidades: mm.
  ROJO = cortar   AZUL = grabar (texto y marcas)   GRIS punteado = borde de hoja (no cortar)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="200mm" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#fff"/>
  <rect x="0.5" y="0.5" width="299" height="199" fill="none" stroke="#999" stroke-width="0.3" stroke-dasharray="3 2"/>

  <g id="cortar" fill="none" stroke="#ff0000" stroke-width="0.1">
    <!-- 1. CHASIS 160 x 70 -->
    <rect x="10" y="10" width="160" height="70" rx="6"/>
    <!-- ranuras soportes eje delantero -->
    <rect x="30" y="15" width="20" height="3"/>
    <rect x="30" y="72" width="20" height="3"/>
    <!-- ranuras soportes eje trasero -->
    <rect x="130" y="15" width="20" height="3"/>
    <rect x="130" y="72" width="20" height="3"/>
    <!-- ranura soporte del motor -->
    <rect x="126" y="58.5" width="28" height="3"/>
    <!-- ventana para la goma y la polea -->
    <rect x="120" y="38" width="40" height="14" rx="2"/>
    <!-- agujero del boton (pulsador 12 mm) -->
    <circle cx="22" cy="45" r="6.25"/>

    <!-- 2. SOPORTES DE EJE x4 (agujero 4 mm: el eje gira libre) -->
    <path d="M15,90 H35 V93 H40 V119 H10 V93 H15 Z"/>  <circle cx="25"  cy="113" r="2"/>
    <path d="M50,90 H70 V93 H75 V119 H45 V93 H50 Z"/>  <circle cx="60"  cy="113" r="2"/>
    <path d="M85,90 H105 V93 H110 V119 H80 V93 H85 Z"/> <circle cx="95"  cy="113" r="2"/>
    <path d="M120,90 H140 V93 H145 V119 H115 V93 H120 Z"/> <circle cx="130" cy="113" r="2"/>

    <!-- 3. SOPORTE DEL MOTOR (hueco para motor 130 de 20 x 15 mm) -->
    <path d="M150,90 H190 V118 H184 V121 H156 V118 H150 Z"/>
    <rect x="159.8" y="98.3" width="20.4" height="15.4"/>
    <circle cx="155" cy="95" r="1.5"/>
    <circle cx="185" cy="95" r="1.5"/>

    <!-- 4. RUEDAS x4, diametro 54 (agujero 2,8 mm: ajustan al eje) -->
    <circle cx="40"  cy="160" r="27"/> <circle cx="40"  cy="160" r="1.4"/>
    <circle cx="100" cy="160" r="27"/> <circle cx="100" cy="160" r="1.4"/>
    <circle cx="160" cy="160" r="27"/> <circle cx="160" cy="160" r="1.4"/>
    <circle cx="220" cy="160" r="27"/> <circle cx="220" cy="160" r="1.4"/>

    <!-- 5. POLEA: 2 discos de 36 + 1 disco de 28 en el medio (forma la canaleta) -->
    <circle cx="210" cy="30" r="18"/> <circle cx="210" cy="30" r="1.4"/>
    <circle cx="255" cy="30" r="18"/> <circle cx="255" cy="30" r="1.4"/>
    <circle cx="232" cy="75" r="14"/> <circle cx="232" cy="75" r="1.4"/>
  </g>

  <g id="grabar" fill="#0000ff" stroke="none" font-family="Arial, sans-serif" font-size="4">
    <!-- lugar del portapilas 2xAA -->
    <rect x="58" y="29" width="58" height="32" fill="none" stroke="#0000ff" stroke-width="0.3" stroke-dasharray="2 1"/>
    <text x="72" y="46">PILAS 2xAA</text>
    <text x="13" y="57" font-size="3.5">BOTON</text>
    <text x="13" y="30" font-size="3.5">FRENTE</text>
    <text x="123" y="35" font-size="3">GOMA / POLEA</text>
    <text x="134" y="68" font-size="3">MOTOR</text>
    <text x="10" y="126" font-size="3.5">SOPORTES DE EJE x4</text>
    <text x="150" y="126" font-size="3.5">SOPORTE MOTOR</text>
    <text x="198" y="105" font-size="3.5">POLEA (pegar 36+28+36)</text>
    <text x="10" y="196" font-size="3.5">RUEDAS x4</text>
    <text x="200" y="196" font-size="3">ROJO=cortar  AZUL=grabar  MDF 3 mm</text>
  </g>
</svg>
